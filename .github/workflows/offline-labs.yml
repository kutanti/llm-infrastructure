name: Offline labs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only framework
        run: >-
          python -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r pipeline/requirements-cpu.txt
      - name: Install lesson and local HF dependencies
        run: python -m pip install -r requirements.txt -r pipeline/requirements-hf.txt
      - name: Run offline regression suite
        run: python -m unittest discover -s tests -v
      - name: Exercise original numerical labs
        shell: python
        run: |
          import subprocess
          import sys
          for script in ("01_why_kv_cache.py", "03_kv_quant_error.py", "05_flash_attention.py"):
              subprocess.run([sys.executable, script], check=True)
          for module in ("course.demos.lora", "course.demos.distillation", "course.demos.quantization"):
              subprocess.run([sys.executable, "-m", module], check=True)
